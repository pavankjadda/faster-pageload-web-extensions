# Builds the add-on for a GitHub release and attaches the files users can install:
# - faster_pageload-<version>.zip: unsigned build, attached as soon as tests pass. Loads temporarily
#   via about:debugging, or permanently in Firefox Developer Edition/Nightly/ESR with
#   xpinstall.signatures.required = false.
# - *.xpi: signed by Mozilla (unlisted channel), attached by a separate job once AMO has signed it
#   (usually a few minutes). The only file regular Firefox installs permanently.
#
# Signing needs the repository secrets AMO_API_KEY (JWT issuer) and AMO_API_SECRET (JWT secret)
# from addons.mozilla.org → Developer Hub → Tools → Manage API Keys. Without them, only the zip
# is attached.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach files to (e.g. v2.0.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: Test, build and attach zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # Third-party action: pinned to a commit so a moved tag can't run new code with our secrets.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match manifest.json version $version (expected v$version)"
            exit 1
          fi

      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build

      - name: Attach zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" web-ext-artifacts/*.zip --clobber

  sign:
    name: Sign with Mozilla and attach xpi
    needs: build
    runs-on: ubuntu-latest
    env:
      HAS_AMO_KEYS: ${{ secrets.AMO_API_KEY != '' && secrets.AMO_API_SECRET != '' }}
    steps:
      - name: Skip without AMO credentials
        if: env.HAS_AMO_KEYS != 'true'
        run: echo "::warning::AMO_API_KEY/AMO_API_SECRET secrets are not set; only the unsigned zip was attached."

      - uses: actions/checkout@v7
        if: env.HAS_AMO_KEYS == 'true'
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.HAS_AMO_KEYS == 'true'
        with:
          version: latest

      - uses: actions/setup-node@v7
        if: env.HAS_AMO_KEYS == 'true'
        with:
          node-version: lts/*
          cache: pnpm

      - if: env.HAS_AMO_KEYS == 'true'
        run: pnpm install --frozen-lockfile

      # AMO signs each version only once. If this version was already submitted (e.g. manually),
      # this fails; the zip is already attached, and the error explains how to add the .xpi.
      - name: Sign (unlisted)
        if: env.HAS_AMO_KEYS == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          if ! pnpm exec web-ext sign --channel=unlisted --approval-timeout 3600000; then
            echo "::error::Signing failed. If $TAG was already submitted to AMO, download the signed .xpi from the Developer Hub and attach it with: gh release upload $TAG <file>.xpi"
            exit 1
          fi

      - name: Attach signed xpi to the release
        if: env.HAS_AMO_KEYS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" web-ext-artifacts/*.xpi --clobber
