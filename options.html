<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      .note {
        color: #777777;
      }
    </style>
  </head>

  <body>
    <form>
      <div><label>Preload every visible link: <input type="checkbox" id="preloadViewport"></label></div>
      <div><label>Lazyload images: <input type="checkbox" id="imgLazyLoad"></label></div>
      <div><label>Blacklist sites: <input type="text" id="blacklistSites" placeholder="www.example.com, *.example2.com" size="30"></label></div>
      <div class="note">Comma separated hosts, e.g. www.example.com, example2.com or *.example2.com (all subdomains). Disables the add-on on those sites.</div>
      <br>
      <div><button type="submit">Save</button> <span id="status" role="status"></span></div>
    </form>

    <script src="js/options.js"></script>
  </body>
</html>
